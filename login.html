<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login Admin - Lapak Suka Suka</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl p-8">

        <div class="text-center mb-8">
            <h1 class="text-3xl font-black text-slate-900">
                Admin Login
            </h1>

            <p class="text-slate-500 mt-2">
                Lapak Suka Suka
            </p>
        </div>

        <div class="space-y-4">

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="Email admin"
                    class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:ring-2 focus:ring-green-500"
                >
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-2">
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="Password"
                    class="w-full border border-slate-300 rounded-xl p-3 outline-none focus:ring-2 focus:ring-green-500"
                >
            </div>

            <button
                onclick="loginAdmin()"
                class="w-full bg-green-600 hover:bg-green-700 text-white font-bold p-3 rounded-xl"
            >
                Login
            </button>

            <p
                id="errorMessage"
                class="text-red-500 text-sm text-center hidden"
            ></p>

        </div>

    </div>

<script>
const SUPABASE_URL =
    "https://ojxmzdyrlvvgmffrcivo.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_8lY-whuj_jAyd1BY6CxbqQ__tUwQaqF";

const client = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


// ===============================
// LOGIN ADMIN
// ===============================
async function loginAdmin() {

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const errorMessage =
        document.getElementById("errorMessage");

    errorMessage.classList.add("hidden");


    if (!email || !password) {

        errorMessage.innerText =
            "Email dan password wajib diisi.";

        errorMessage.classList.remove("hidden");

        return;
    }


    const { data, error } =
        await client.auth.signInWithPassword({
            email: email,
            password: password
        });


    if (error) {

        console.error(error);

        errorMessage.innerText =
            "Email atau password salah.";

        errorMessage.classList.remove("hidden");

        return;
    }


    console.log("LOGIN BERHASIL:", data);

    window.location.href = "admin.html";
}

</script>
</body>
</html>
